name: Update GitHub Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate GitHub Stats
        run: |
          curl -fL \
          "https://github-readme-stats-fast.vercel.app/api?username=govindkumarsrivastavacg&show_icons=true&theme=tokyonight&hide_border=true" \
          -o profile/stats.svg

      - name: Generate Top Languages
        run: |
          curl -fL \
          "https://github-readme-stats-fast.vercel.app/api/top-langs/?username=govindkumarsrivastavacg&layout=compact&theme=tokyonight&hide_border=true" \
          -o profile/top-langs.svg

      - name: Generate Streak
        run: |
          curl -fL \
          "https://streak-stats.demolab.com/?user=govindkumarsrivastavacg&theme=tokyonight&hide_border=true" \
          -o profile/streak.svg

      - name: Check generated files
        run: |
          echo "Stats:"
          file profile/stats.svg
          echo "Top Languages:"
          file profile/top-langs.svg
          echo "Streak:"
          file profile/streak.svg

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet || git commit -m "Update GitHub profile cards"
          git push
